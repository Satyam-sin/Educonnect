<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" fill="none">
  <rect x="6" y="6" width="628" height="218" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Mirror & Rays -->
  <line x1="36" y1="184" x2="274" y2="184" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="38" x2="155" y2="184" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="65" y1="64" x2="155" y2="184" stroke="#fde047" stroke-width="3.2"/>
  <line x1="155" y1="184" x2="245" y2="64" stroke="#34d399" stroke-width="3.2"/>
  <text x="122" y="124" fill="#fde047" font-family="sans-serif" font-weight="900" font-size="16">∠i</text>
  <text x="168" y="124" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="16">∠r</text>
  <text x="126" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="12">Normal (90°)</text>
  <text x="86" y="208" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="14">∠i = ∠r   |   θ = 90° − ∠i</text>

  <!-- Right Optics Formulas -->
  <rect x="298" y="26" width="314" height="178" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="318" y="56" fill="#22d3ee" font-family="sans-serif" font-weight="900" font-size="17">Key Optics &amp; Lens Formulas</text>
  <text x="318" y="88" fill="#fde047" font-family="sans-serif" font-weight="700" font-size="14">• Focal Length:  f = R / 2</text>
  <text x="318" y="116" fill="#e2e8f0" font-family="sans-serif" font-size="14">• Lens Power:  P = 1 / f (m)  [Dioptre, D]</text>
  <text x="318" y="144" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="14">• Two Plane Mirrors: n = (360° / θ) − 1</text>
  <text x="318" y="172" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Magnification:  m = h′ / h</text>
  <text x="318" y="194" fill="#94a3b8" font-family="sans-serif" font-size="12">Speed of Light in Vacuum: c = 3 × 10⁸ m/s</text>
</svg>
