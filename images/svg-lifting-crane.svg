<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" fill="none">
  <rect width="420" height="190" rx="16" fill="#0F172A"/>
  <text x="210" y="25" text-anchor="middle" fill="#FDE047" font-family="sans-serif" font-size="12" font-weight="bold">SCRAPYARD LIFTING ELECTROMAGNET CRANE</text>
  <!-- Crane Arm -->
  <path d="M36 168V52H260" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="220" y1="56" x2="220" y2="96" stroke="#CBD5E1" stroke-width="3.5"/>
  <!-- Electromagnet Disc -->
  <rect x="174" y="94" width="92" height="24" rx="8" fill="#EF4444" stroke="#FECDD3" stroke-width="2.2"/>
  <text x="220" y="110" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">MAGNET ON</text>
  <!-- Lifted Iron Scrap -->
  <rect x="184" y="122" width="22" height="12" rx="3" fill="#94A3B8"/>
  <rect x="210" y="122" width="26" height="14" rx="3" fill="#CBD5E1"/>
  <rect x="240" y="122" width="18" height="12" rx="3" fill="#94A3B8"/>
  <circle cx="204" cy="142" r="6" fill="#64748B"/><circle cx="232" cy="143" r="6" fill="#64748B"/>
  <!-- Info Box -->
  <rect x="284" y="54" width="120" height="106" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="344" y="78" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">Switch ON</text>
  <text x="344" y="94" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="10">Lifts heavy iron</text>
  <text x="344" y="124" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="11" font-weight="bold">Switch OFF</text>
  <text x="344" y="140" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="10">Drops scrap!</text>
</svg>
