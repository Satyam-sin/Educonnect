<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none">
  <rect x="6" y="6" width="628" height="208" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="24" y="24" width="290" height="172" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="42" y="54" fill="#a5b4fc" font-family="sans-serif" font-weight="900" font-size="16">Golden Algebraic Identities</text>
  <text x="42" y="86" fill="#fde047" font-family="sans-serif" font-weight="800" font-size="14">(a + b)² = a² + 2ab + b²</text>
  <text x="42" y="114" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="14">(a − b)² = a² − 2ab + b²</text>
  <text x="42" y="142" fill="#34d399" font-family="sans-serif" font-weight="800" font-size="14">a² − b² = (a + b)(a − b)</text>
  <text x="42" y="170" fill="#f472b6" font-family="sans-serif" font-weight="800" font-size="14">(x+a)(x+b) = x² + (a+b)x + ab</text>

  <rect x="330" y="24" width="286" height="172" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="348" y="54" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="16">CHS Commercial Maths</text>
  <text x="348" y="86" fill="#fde047" font-family="sans-serif" font-weight="800" font-size="14">SI = (P × R × T) / 100</text>
  <text x="348" y="114" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="14">A = P (1 + R/100)ⁿ  [CI = A − P]</text>
  <text x="348" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="13">Profit % = (Profit / CP) × 100</text>
  <text x="348" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="13">Discount % = (Discount / MP) × 100</text>
</svg>
