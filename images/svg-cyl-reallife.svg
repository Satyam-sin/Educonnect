<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" fill="none">
  <rect x="6" y="6" width="648" height="198" rx="22" fill="#070d24" stroke="#22d3ee" stroke-width="2.2"/>
  <!-- 3 Real-life Icons -->
  <rect x="28" y="34" width="184" height="142" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="74" y="54" width="92" height="44" rx="18" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="58" y="124" fill="#fde047" font-family="sans-serif" font-weight="900" font-size="14">Road Roller</text>
  <text x="44" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="12">1 Roll = CSA (2πrh)</text>
  <text x="44" y="164" fill="#38bdf8" font-family="sans-serif" font-size="12">N Rolls = N × 2πrh</text>

  <rect x="238" y="34" width="184" height="142" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.8"/>
  <rect x="304" y="48" width="52" height="58" rx="12" fill="#10b981" fill-opacity="0.32" stroke="#34d399" stroke-width="2.5"/>
  <text x="272" y="126" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="14">LPG / Soda Can</text>
  <text x="252" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="12">No weak sharp corners</text>
  <text x="252" y="164" fill="#6ee7b7" font-family="sans-serif" font-size="12">Handles high pressure!</text>

  <rect x="448" y="34" width="184" height="142" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
  <circle cx="540" cy="76" r="24" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="2.5"/>
  <rect x="516" y="52" width="48" height="48" stroke="#fde047" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="470" y="126" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="14">Archimedes' Tomb</text>
  <text x="462" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="12">Sphere inside Cylinder</text>
  <text x="462" y="164" fill="#fde047" font-family="sans-serif" font-size="12">Vol &amp; Area Ratio = 2:3</text>
</svg>
