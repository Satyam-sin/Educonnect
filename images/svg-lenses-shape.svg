<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" fill="none">
  <rect width="440" height="195" rx="16" fill="#0F172A"/>
  <line x1="220" y1="16" x2="220" y2="178" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- Convex Lens -->
  <text x="110" y="26" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11.5" font-weight="bold">CONVEX LENS (Converging)</text>
  <path d="M110 44C132 72 132 122 110 150C88 122 88 72 110 44Z" fill="#34D399" fill-opacity="0.35" stroke="#6EE7B7" stroke-width="3"/>
  <text x="110" y="174" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="10" font-weight="bold">Thicker in Middle • Magnifying Glass</text>
  <!-- Concave Lens -->
  <text x="330" y="26" text-anchor="middle" fill="#F472B6" font-family="sans-serif" font-size="11.5" font-weight="bold">CONCAVE LENS (Diverging)</text>
  <path d="M312 44H348C334 74 334 120 348 150H312C326 120 326 74 312 44Z" fill="#F472B6" fill-opacity="0.35" stroke="#FBCFE8" stroke-width="3" stroke-linejoin="round"/>
