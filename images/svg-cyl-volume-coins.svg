<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" fill="none">
  <rect x="6" y="6" width="648" height="228" rx="22" fill="#070d24" stroke="#10b981" stroke-width="2.2"/>
  <!-- Stacked Coins Visual -->
  <ellipse cx="148" cy="186" rx="74" ry="18" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="148" cy="166" rx="74" ry="18" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="148" cy="146" rx="74" ry="18" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="148" cy="126" rx="74" ry="18" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="148" cy="106" rx="74" ry="18" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="148" cy="86" rx="74" ry="18" fill="#fde047" fill-opacity="0.45" stroke="#fde047" stroke-width="2.8"/>
  <text x="112" y="92" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="14">Area = πr²</text>
  <line x1="242" y1="86" x2="242" y2="186" stroke="#34d399" stroke-width="2.8"/>
  <text x="252" y="142" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="16">h</text>
  <text x="66" y="220" fill="#fde047" font-family="sans-serif" font-weight="800" font-size="13">Coins stacked to height h</text>

  <!-- Right Volume Card -->
  <rect x="304" y="28" width="326" height="184" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="326" y="58" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="17">VOLUME = BASE AREA × HEIGHT</text>
  <text x="326" y="92" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22">V = π × r² × h</text>
  <text x="326" y="124" fill="#cbd5e1" font-family="sans-serif" font-size="13">Think of stacking identical circular coins</text>
  <text x="326" y="144" fill="#cbd5e1" font-family="sans-serif" font-size="13">(each of area πr²) up to height h!</text>
  <text x="326" y="176" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="14">Capacity: 1000 cm³ = 1 Litre</text>
  <text x="326" y="198" fill="#fde047" font-family="sans-serif" font-weight="800" font-size="14">1 m³ = 1000 Litres</text>
</svg>
