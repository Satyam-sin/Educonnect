<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <rect x="6" y="6" width="628" height="228" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Ohm Triangle -->
  <polygon points="145,32 48,200 242,200" fill="#eab308" fill-opacity="0.16" stroke="#facc15" stroke-width="3" stroke-linejoin="round"/>
  <line x1="90" y1="128" x2="200" y2="128" stroke="#fb923c" stroke-width="3"/>
  <line x1="145" y1="128" x2="145" y2="200" stroke="#fb923c" stroke-width="3"/>
  <text x="132" y="105" fill="#fde047" font-family="sans-serif" font-weight="900" font-size="34">V</text>
  <text x="103" y="178" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="30">I</text>
  <text x="172" y="178" fill="#fb7185" font-family="sans-serif" font-weight="900" font-size="30">R</text>
  <text x="72" y="222" fill="#cbd5e1" font-family="sans-serif" font-weight="700" font-size="13">Ohm's Law: V = I × R</text>

  <!-- Right 3 Formula Strips -->
  <rect x="282" y="24" width="332" height="54" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="48" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="16">Current: I = Q / t   (Unit: Ampere, A)</text>
  <text x="300" y="68" fill="#94a3b8" font-family="sans-serif" font-size="12">1 Ampere = 1 Coulomb / second</text>

  <rect x="282" y="92" width="332" height="54" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="300" y="116" fill="#fb7185" font-family="sans-serif" font-weight="900" font-size="16">Joule Heating: H = I² × R × t   (Joule)</text>
  <text x="300" y="136" fill="#94a3b8" font-family="sans-serif" font-size="12">Nichrome wire has high R → glows red hot</text>

  <rect x="282" y="160" width="332" height="56" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="184" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="16">Power: P = V × I   (Unit: Watt, W)</text>
  <text x="300" y="204" fill="#fde047" font-family="sans-serif" font-weight="700" font-size="12">1 Unit (1 kWh) = 3.6 × 10⁶ Joules</text>
</svg>
