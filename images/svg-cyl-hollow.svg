<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" fill="none">
  <rect x="6" y="6" width="648" height="218" rx="22" fill="#070d24" stroke="#a855f7" stroke-width="2.2"/>
  <!-- Cross Section Ring -->
  <circle cx="145" cy="115" r="76" fill="#8b5cf6" fill-opacity="0.28" stroke="#c084fc" stroke-width="3"/>
  <circle cx="145" cy="115" r="42" fill="#070d24" stroke="#38bdf8" stroke-width="2.8"/>
  <line x1="145" y1="115" x2="187" y2="115" stroke="#38bdf8" stroke-width="2.6"/>
  <text x="158" y="108" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="15">r</text>
  <line x1="145" y1="115" x2="145" y2="39" stroke="#fde047" stroke-width="2.6"/>
  <text x="152" y="72" fill="#fde047" font-family="sans-serif" font-weight="900" font-size="15">R</text>
  <text x="72" y="210" fill="#c084fc" font-family="sans-serif" font-weight="800" font-size="13">Wall Thickness = R − r</text>

  <!-- Right Formulas -->
  <rect x="272" y="26" width="358" height="178" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <text x="292" y="56" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="17">HOLLOW CYLINDER (PIPES &amp; TUBES)</text>
  <text x="292" y="88" fill="#fde047" font-family="sans-serif" font-weight="800" font-size="14">• Ring Cross-Section Area = π(R² − r²)</text>
  <text x="292" y="116" fill="#34d399" font-family="sans-serif" font-weight="800" font-size="15">• Metal Volume = π(R² − r²)h</text>
  <text x="292" y="144" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="14">• Total CSA = Outer (2πRh) + Inner (2πrh)</text>
  <text x="292" y="172" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="14">• TSA = 2π(R + r)(h + R − r)</text>
</svg>
