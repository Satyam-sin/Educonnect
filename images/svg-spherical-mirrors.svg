  <text x="256" y="110" text-anchor="middle" fill="#FEF08A" font-family="sans-serif" font-size="10.5" font-weight="bold">Outer Side</text>
  <text x="330" y="174" text-anchor="middle" fill="#FED7AA" font-family="sans-serif" font-size="10">Like OUTER bulging side of a spoon</text>
