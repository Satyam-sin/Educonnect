  <path d="M148 52L157 48M156 72L166 70M160 98L170 98M156 124L166 126M148 144L157 148" stroke="#94A3B8" stroke-width="2.2"/>
  <text x="84" y="96" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="10.5" font-weight="bold">Reflecting</text>
  <text x="84" y="110" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="10.5" font-weight="bold">Inner Side →</text>
