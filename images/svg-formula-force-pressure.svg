<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <rect x="6" y="6" width="628" height="228" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Left: F = m x a Block -->
  <rect x="26" y="28" width="276" height="184" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="46" y="58" fill="#60a5fa" font-family="sans-serif" font-weight="900" font-size="18">Force: F = m × a</text>
  <rect x="128" y="86" width="76" height="58" rx="10" fill="#3b82f6" fill-opacity="0.35" stroke="#60a5fa" stroke-width="2.6"/>
  <text x="148" y="121" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="17">m kg</text>
  <path d="M52 115H118M108 106L118 115L108 124" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="102" fill="#fbbf24" font-family="sans-serif" font-weight="800" font-size="15">F (N)</text>
  <path d="M214 115H276M266 106L276 115L266 124" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="218" y="102" fill="#34d399" font-family="sans-serif" font-weight="800" font-size="14">a (m/s²)</text>
  <text x="46" y="176" fill="#cbd5e1" font-family="sans-serif" font-size="13">Weight: W = m × g  (g ≈ 9.8 m/s²)</text>
  <text x="46" y="196" fill="#fde047" font-family="sans-serif" font-weight="700" font-size="13">1 Newton = 1 kg·m/s²</text>

  <!-- Right: P = F / A Comparison -->
  <rect x="322" y="28" width="292" height="184" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="342" y="58" fill="#fb7185" font-family="sans-serif" font-weight="900" font-size="18">Pressure: P = F / A</text>
  <!-- Sharp Nail -->
  <polygon points="390,152 382,92 398,92" fill="#fb7185"/>
  <rect x="372" y="84" width="36" height="10" rx="3" fill="#fda4af"/>
  <text x="344" y="174" fill="#fda4af" font-family="sans-serif" font-weight="700" font-size="12">Small Area → HIGH P</text>
  <!-- Wide Block -->
  <rect x="498" y="108" width="78" height="44" rx="6" fill="#34d399" fill-opacity="0.35" stroke="#34d399" stroke-width="2.4"/>
  <text x="488" y="174" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="12">Large Area → LOW P</text>
  <text x="342" y="198" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="13">SI Unit: Pascal (1 Pa = 1 N/m²)</text>
</svg>
