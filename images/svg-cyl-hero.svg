<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" fill="none">
  <defs>
    <linearGradient id="chWall" x1="120" y1="40" x2="310" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.32"/><stop offset="50%" stop-color="#6366f1" stop-opacity="0.22"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="648" height="258" rx="22" fill="#070d24" stroke="#1e3a8a" stroke-width="2.2"/>
  <!-- 3D Cylinder -->
  <path d="M125 68 V204 C125 224 275 224 275 204 V68 Z" fill="url(#chWall)" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="200" cy="68" rx="75" ry="22" fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="200" cy="204" rx="75" ry="22" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- Axis & Radius -->
  <line x1="200" y1="68" x2="200" y2="204" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="200" y1="68" x2="275" y2="68" stroke="#fde047" stroke-width="3.2"/>
  <circle cx="200" cy="68" r="4.5" fill="#fde047"/>
  <text x="230" y="60" fill="#fde047" font-family="sans-serif" font-weight="900" font-size="17">r</text>
  <!-- Height Arrow -->
  <line x1="94" y1="68" x2="94" y2="204" stroke="#34d399" stroke-width="2.8"/>
  <path d="M88 76L94 68L100 76M88 196L94 204L100 196" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <text x="68" y="142" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="18">h</text>
  <!-- Labels on Right -->
  <rect x="320" y="28" width="310" height="214" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="342" y="58" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="17">ANATOMY OF A CYLINDER</text>
  <text x="342" y="88" fill="#fde047" font-family="sans-serif" font-weight="800" font-size="14">• 2 Flat Circular Bases (Top &amp; Bottom)</text>
  <text x="342" y="114" fill="#e2e8f0" font-family="sans-serif" font-size="14">• 1 Smooth Curved Lateral Surface</text>
  <text x="342" y="140" fill="#34d399" font-family="sans-serif" font-weight="800" font-size="14">• Total Faces = 3  |  Curved Edges = 2</text>
  <text x="342" y="166" fill="#fb7185" font-family="sans-serif" font-weight="800" font-size="14">• Vertices (Sharp Corners) = 0</text>
  <text x="342" y="196" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="13">Diameter d = 2r  |  Base Circumference = 2πr</text>
  <text x="342" y="220" fill="#94a3b8" font-family="sans-serif" font-size="12">Axis is perpendicular (90°) to both circular bases</text>
</svg>
