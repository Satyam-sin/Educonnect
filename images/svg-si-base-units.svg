<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <rect x="6" y="6" width="628" height="228" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="202" y="38" fill="#fde047" font-family="sans-serif" font-weight="900" font-size="18">THE 7 FUNDAMENTAL SI BASE UNITS</text>
  <!-- 7 Pills -->
  <rect x="26" y="58" width="136" height="68" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.2"/>
  <text x="78" y="86" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="22">m</text>
  <text x="46" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="12">Length (Metre)</text>

  <rect x="176" y="58" width="136" height="68" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2.2"/>
  <text x="228" y="86" fill="#818cf8" font-family="sans-serif" font-weight="900" font-size="22">kg</text>
  <text x="195" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="12">Mass (Kilogram)</text>

  <rect x="326" y="58" width="136" height="68" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2.2"/>
  <text x="386" y="86" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="22">s</text>
  <text x="348" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="12">Time (Second)</text>

  <rect x="476" y="58" width="138" height="68" rx="14" fill="#1e293b" stroke="#facc15" stroke-width="2.2"/>
  <text x="536" y="86" fill="#facc15" font-family="sans-serif" font-weight="900" font-size="22">A</text>
  <text x="492" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="12">Current (Ampere)</text>

  <rect x="96" y="144" width="142" height="68" rx="14" fill="#1e293b" stroke="#fb923c" stroke-width="2.2"/>
  <text x="158" y="172" fill="#fb923c" font-family="sans-serif" font-weight="900" font-size="22">K</text>
  <text x="116" y="198" fill="#cbd5e1" font-family="sans-serif" font-size="12">Temp (Kelvin)</text>

  <rect x="252" y="144" width="142" height="68" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="2.2"/>
  <text x="302" y="172" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="22">mol</text>
  <text x="272" y="198" fill="#cbd5e1" font-family="sans-serif" font-size="12">Amount (Mole)</text>

  <rect x="408" y="144" width="142" height="68" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="2.2"/>
  <text x="464" y="172" fill="#f472b6" font-family="sans-serif" font-weight="900" font-size="22">cd</text>
  <text x="424" y="198" fill="#cbd5e1" font-family="sans-serif" font-size="12">Light (Candela)</text>
</svg>
